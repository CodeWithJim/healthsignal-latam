<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthSignal LATAM</title>
<style>
  :root{
    --ground:#0d1618; --surface:#141f21; --surface2:#1b282a;
    --line:#2a3a3c; --text:#e2edeb; --text2:#9db0b1; --text3:#71888a;
    --accent:#4fbab2; --crit:#d77162; --high:#d9954a; --med:#4fbab2; --low:#71888a;
    --good:#6fb077;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);
       font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  code,.mono{font-family:ui-monospace,Consolas,monospace}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
         display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--text3);font-size:12px}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 53px)}
  @media(max-width:900px){
    .grid{display:flex;flex-direction:column;height:auto}
    .grid.showing main{order:-1}
  }
  aside{border-right:1px solid var(--line);overflow-y:auto}
  main{overflow-y:auto;padding:20px}
  .bar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  button{background:var(--surface2);color:var(--text2);border:1px solid var(--line);
         border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover{color:var(--text);border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#0d1618;font-weight:600}
  input{background:var(--surface2);border:1px solid var(--line);color:var(--text);
         border-radius:4px;padding:5px 8px;font:12px ui-monospace,monospace}
  .ia-toggle{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:12px;
             cursor:pointer;white-space:nowrap}
  .ia-toggle input{accent-color:var(--accent);cursor:pointer}
  .ia-toggle input:disabled{cursor:not-allowed}
  .row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
       gap:9px;align-items:center}
  .row:hover{background:var(--surface)}
  .row.sel{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
  .pill{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:3px;
        white-space:nowrap}
  .CRITICAL{background:#d7716222;color:var(--crit)}
  .HIGH{background:#d9954a22;color:var(--high)}
  .MEDIUM{background:#4fbab222;color:var(--med)}
  .LOW{background:#71888a22;color:var(--low)}
  .rid{font-family:ui-monospace,monospace;font-size:11px;color:var(--text2);flex:1}
  .sc{font-family:ui-monospace,monospace;font-size:12px;color:var(--text)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;
        padding:16px 18px;margin-bottom:16px}
  .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);
       margin-bottom:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--text3);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:6px 8px;border-bottom:1px solid var(--surface2);color:var(--text2);
     font-family:ui-monospace,monospace}
  td.k{color:var(--text)}
  .expl{color:var(--text2);font-size:13px;line-height:1.65}
  .kv{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
  .kv div span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
               color:var(--text3)}
  .kv div b{font-size:19px;font-family:ui-monospace,monospace;font-weight:600}
  .rule{border-left:2px solid var(--high);padding:7px 12px;margin:6px 0;
        background:var(--surface2);border-radius:0 4px 4px 0;font-size:12px}
  .rule.zero{border-left-color:var(--text3)}
  .rule b{color:var(--text)}
  .narrative{border-color:var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface2))}
  .narrative-top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;
                 flex-wrap:wrap;margin-bottom:10px}
  .narrative h2{font-size:18px;font-weight:500;margin:0;max-width:760px}
  .narrative p{color:var(--text2);font-size:14px;line-height:1.7;margin:8px 0 14px}
  .source{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
          border:1px solid var(--line);border-radius:3px;padding:3px 7px}
  .findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px;
            margin:12px 0 16px}
  .finding{background:var(--ground);border-left:2px solid var(--accent);padding:8px 10px}
  .finding b{display:block;font-size:12px;font-weight:500}
  .finding span{color:var(--text2);font:12px ui-monospace,monospace}
  .review{margin:6px 0 14px;padding-left:20px;color:var(--text2)}
  .review li{padding:3px 0}
  .refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .refs a{font:10px ui-monospace,monospace;background:var(--ground);padding:3px 6px;
          border-radius:3px;text-decoration:none}
  .disclaimer{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);
              color:var(--text3);font-size:11px}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
  .chart-item{background:var(--ground);border:1px solid var(--line);border-radius:4px;padding:8px}
  .chart-head{display:flex;justify-content:space-between;gap:10px;font:11px ui-monospace,monospace;
              color:var(--text2);margin-bottom:3px}
  .chart-head b{color:var(--text);font-weight:600}
  .lab-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .lab-chip{background:var(--ground);border:1px solid var(--line);border-radius:4px;
            padding:6px 8px;font:11px ui-monospace,monospace;color:var(--text2)}
  .lab-chip.abnormal{border-color:var(--high);color:var(--high)}
  .empty{color:var(--text3);padding:40px 0;text-align:center}
  a{color:var(--accent)}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>HealthSignal LATAM</h1>
  <span class="sub">motor de concordancia · apoyo a la decisión, no diagnóstico</span>
  <span style="flex:1"></span>
  <input id="p" value="PAT-0869" size="10" title="paciente">
  <input id="t" type="datetime-local" value="2026-07-20T18:00" title="corte opcional del historial">
  <button onclick="analizarHasta()">Analizar hasta fecha</button>
  <button onclick="historiaCompleta()">Historia completa</button>
  <label class="ia-toggle" id="iaControl" title="Usar OpenAI para redactar la síntesis">
    <input id="iaToggle" type="checkbox" onchange="actualizarIA(this.checked)"> IA
  </label>
  <span class="sub" id="ver"></span>
</header>

<div class="grid">
  <aside>
    <div class="bar" id="filtros"></div>
    <div id="lista"></div>
  </aside>
  <main id="det"><div class="empty">Elegí una señal, analiza la historia hasta una fecha o revisa el encuentro completo.</div></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fecha = s => String(s ?? '').replace('T', ' ').slice(0, 16);
let filtro = null, sel = null;

fetch('/health').then(r => r.json()).then(h => {
  actualizarEstadoIA(h.narrative);
  $('#ver').textContent = `${h.signals} señales · ${h.model_version}`;
});

function actualizarEstadoIA(estado){
  const toggle = $('#iaToggle'), control = $('#iaControl');
  const configurada = Boolean(estado?.configured);
  toggle.checked = Boolean(estado?.enabled);
  toggle.disabled = !configurada;
  control.title = configurada
    ? (toggle.checked ? 'Desactivar OpenAI y usar la síntesis local' : 'Activar OpenAI para la síntesis')
    : 'La clave de OpenAI no está configurada en el servidor';
}

async function actualizarIA(enabled){
  const toggle = $('#iaToggle');
  let actualizado = false;
  toggle.disabled = true;
  try {
    const r = await fetch('/narrative/settings', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled}),
    });
    if (!r.ok) throw new Error((await r.json()).detail || 'No se pudo actualizar la IA');
    actualizarEstadoIA(await r.json());
    actualizado = true;
  } catch (error) {
    $('#det').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  } finally {
    if (!actualizado) fetch('/narrative/settings').then(r => r.json())
      .then(actualizarEstadoIA)
      .catch(() => { toggle.checked = !enabled; toggle.disabled = false; });
  }
}

['TODAS','CRITICAL','HIGH','MEDIUM','LOW'].forEach(p => {
  const b = document.createElement('button');
  b.textContent = p; b.onclick = () => { filtro = p === 'TODAS' ? null : p; cargar(); };
  if (p === 'TODAS') b.className = 'on';
  $('#filtros').appendChild(b);
});

async function cargar(){
  [...$('#filtros').children].forEach(b =>
    b.className = (b.textContent === (filtro || 'TODAS')) ? 'on' : '');
  const q = new URLSearchParams({limit: 200});
  if (filtro) q.set('priority', filtro);
  const filas = await (await fetch('/signals?' + q)).json();
  $('#lista').innerHTML = filas.map(s => `
    <div class="row" data-id="${s.signal_id}" onclick="ver('${s.signal_id}')">
      <span class="pill ${s.priority_level}">${s.priority_level}</span>
      <span class="rid">${s.patient_id}<br><span style="color:var(--text3)">${fecha(s.decision_datetime)}</span></span>
      <span class="sc">${s.risk_score.toFixed(3)}</span>
    </div>`).join('') || '<div class="empty">Sin señales.</div>';
}

async function ver(id){
  sel = id;
  [...document.querySelectorAll('.row')].forEach(r =>
    r.classList.toggle('sel', r.dataset.id === id));
  const d = await (await fetch('/signals/' + id)).json();
  const s = d.signal;
  $('#det').innerHTML = '<div class="empty">Preparando lectura fundamentada…</div>';
  const q = new URLSearchParams({hasta:String(s.decision_datetime).replace(' ', 'T'), narrative:'true'});
  const ev = await (await fetch(`/patients/${s.patient_id}/history-analysis?${q}`)).json();
  pintar(ev);
}

async function analizarHistoria(completa){
  const p = $('#p').value.trim(), t = $('#t').value.trim();
  if (!p) { $('#det').innerHTML = '<div class="empty">Ingresa un código de paciente.</div>'; return; }
  if (!completa && !t) {
    $('#det').innerHTML = '<div class="empty">Elige una fecha o usa “Historia completa”.</div>'; return;
  }
  $('#det').innerHTML = '<div class="empty">Analizando la trayectoria completa y preparando la lectura…</div>';
  const q = new URLSearchParams({narrative:'true'});
  if (!completa) q.set('hasta', t);
  const r = await fetch(`/patients/${encodeURIComponent(p)}/history-analysis?${q}`);
  if (!r.ok) { $('#det').innerHTML = `<div class="empty">${esc((await r.json()).detail)}</div>`; return; }
  const d = await r.json();
  pintar(d);
}

function analizarHasta(){ return analizarHistoria(false); }
function historiaCompleta(){ return analizarHistoria(true); }

function pintar(d){
  const peak = d.historical_peak || d;
  const porRol = {};
  peak.evidencia.forEach(e => (porRol[e.evidence_role] ||= []).push(e));
  const periodo = d.history_mode === 'complete' ? 'encuentro completo' : 'historia hasta el corte';
  document.querySelector('.grid').classList.add('showing');
  $('#det').innerHTML = `
  ${narrativa(d, peak)}

  <div class="card">
    <div class="kv">
      <div><span>paciente</span><b>${esc(d.patient_id)}</b></div>
      <div><span>período</span><b style="font-size:13px">${periodo}</b></div>
      <div><span>estado al cierre</span><b><span class="pill ${d.priority_level}"
           style="font-size:13px">${d.priority_level}</span></b></div>
      <div><span>riesgo al cierre</span><b>${d.risk_score.toFixed(3)}</b></div>
      <div><span>máxima prioridad</span><b><span class="pill ${peak.priority_level}"
           style="font-size:13px">${peak.priority_level}</span></b></div>
      <div><span>riesgo máximo</span><b>${peak.risk_score.toFixed(3)}</b></div>
      <div><span>momento máximo</span><b style="font-size:13px">${fecha(peak.decision_datetime)}</b></div>
    </div>
    <div class="expl">Al cierre (${fecha(d.history_end)}): ${esc(d.explanation)}</div>
  </div>

  ${grafico(d)}

  <div class="card">
    <div class="lbl">Contribución en el episodio de máxima prioridad · ${fecha(peak.decision_datetime)}</div>
    <div class="scroll"><table>
      <tr><th>canal</th><th>aporte</th><th>nivel</th><th>deriva</th><th>persist.</th>
          <th>cobertura</th><th>último</th><th>baseline</th><th>n ev/bl</th></tr>
      ${peak.canales.map(c => `<tr>
        <td class="k">${c.variable_code}</td><td class="k">${c.contribucion.toFixed(2)}</td>
        <td>${c.nivel_sigmas >= 0 ? '+' : ''}${c.nivel_sigmas.toFixed(1)}σ</td>
        <td>${c.deriva_sigmas >= 0 ? '+' : ''}${c.deriva_sigmas.toFixed(1)}σ</td>
        <td>${(c.persistencia * 100).toFixed(0)}%</td>
        <td>${(c.cobertura * 100).toFixed(0)}%</td>
        <td>${c.ultimo_valor}</td>
        <td>${c.baseline_mediana} ±${c.baseline_escala}</td>
        <td>${c.n_evidencia}/${c.n_baseline}</td></tr>`).join('')}
    </table></div>
  </div>

  ${peak.reglas.length ? `<div class="card">
    <div class="lbl">Reglas evaluadas en el episodio máximo</div>
    ${peak.reglas.map(r => `<div class="rule ${r.fuerza ? '' : 'zero'}">
      <b>${esc(r.regla)}</b> ${r.fuerza ? `— puntaje reducido ${(r.fuerza * 100).toFixed(0)}%`
                                        : '— evaluada sin suprimir'}<br>
      <span style="color:var(--text3)">${esc(r.motivo)}</span>
      ${r.citas.length ? `<br><span class="mono" style="font-size:11px;color:var(--text3)">
        cita: ${r.citas.map(esc).join(', ')}</span>` : ''}
    </div>`).join('')}
  </div>` : ''}

  <div class="card">
    <div class="lbl">Evidencia · cada fila apunta a un registro real de RISA</div>
    ${Object.entries(porRol).map(([rol, filas]) => `
      <div style="margin-bottom:14px">
        <div style="font-size:11px;color:var(--accent);margin-bottom:4px">${rol} · ${filas.length}</div>
        <div class="scroll"><table>
          <tr><th>source_file</th><th>record_id</th><th>variable</th>
              <th>ocurrió</th><th>disponible</th></tr>
          ${filas.slice(0, 12).map(e => `<tr>
            <td>${esc(e.source_file)}</td>
            <td class="k"><a href="/source-row?source_file=${encodeURIComponent(e.source_file)}&record_id=${encodeURIComponent(e.record_id)}"
               target="_blank">${esc(e.record_id)}</a></td>
            <td>${esc(e.variable_code || '')}</td>
            <td>${fecha(e.event_datetime)}</td>
            <td>${fecha(e.available_datetime)}</td></tr>`).join('')}
        </table></div>
        ${filas.length > 12 ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">
          y ${filas.length - 12} más</div>` : ''}
      </div>`).join('')}
  </div>`;

  dibujar(d);
}

function narrativa(d, peak){
  const n = d.narrative;
  if (!n) return '';
  const evidence = Object.fromEntries([...d.evidencia, ...peak.evidencia].map(e => [e.record_id, e]));
  const source = n.source === 'openai'
    ? `Síntesis con ${esc(n.model)}`
    : 'Síntesis local de respaldo';
  const refs = n.evidence_refs.map(id => {
    const e = evidence[id];
    if (!e) return `<span class="mono">${esc(id)}</span>`;
    const href = `/source-row?source_file=${encodeURIComponent(e.source_file)}&record_id=${encodeURIComponent(id)}`;
    return `<a href="${href}" target="_blank">${esc(id)}</a>`;
  }).join('');

  return `<div class="card narrative">
    <div class="narrative-top">
      <div><div class="lbl">Lectura para revisión profesional</div><h2>${esc(n.title)}</h2></div>
      <span class="source">${source}</span>
    </div>
    <p>${esc(n.summary)}</p>
    <div class="findings">
      ${n.findings.map(f => `<div class="finding">
        <b>${esc(f.label)} · ${esc(f.direction)}</b>
        <span>basal ${f.baseline} → último ${f.latest} ${esc(f.unit)}</span><br>
        <span>persistencia ${(f.persistence * 100).toFixed(0)}% · cobertura ${(f.coverage * 100).toFixed(0)}%</span>
      </div>`).join('')}
    </div>
    <div class="lbl">Qué revisar</div>
    <ul class="review">${n.review_points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${refs ? `<div class="lbl">Registros citados</div><div class="refs">${refs}</div>` : ''}
    <div class="disclaimer">${esc(n.disclaimer)} La IA redacta la síntesis; el riesgo, la prioridad y los registros provienen del motor determinista.</div>
  </div>`;
}

function grafico(d){
  return `<div class="card"><div class="lbl">Historia disponible · ${fecha(d.history_start)}
    → ${fecha(d.history_end)}</div><div id="cv"></div></div>`;
}

async function dibujar(d){
  const codes = ['HR','RR','TEMP','SpO2','SBP','DBP'];
  const labs = ['LAB_A','LAB_B','LAB_C','LAB_D'];
  const desde = String(d.history_start).replace(' ', 'T');
  const hasta = String(d.history_end).replace(' ', 'T');
  const q = new URLSearchParams({desde, hasta, as_of:hasta,
                                 variables:[...codes, ...labs].join(',')});
  const r = await (await fetch(`/patients/${d.patient_id}/timeline?${q}`)).json();

  const COL = {HR:'#d77162', RR:'#d9954a', TEMP:'#4fbab2', SpO2:'#6fb077',
               SBP:'#9b8ec4', DBP:'#c4a08e'};
  const W = 500, H = 92, PL = 8, PR = 8, PT = 8, PB = 15;
  const t0 = new Date(desde).getTime(), t1raw = new Date(hasta).getTime();
  const t1 = t1raw === t0 ? t0 + 1 : t1raw;
  const peak = d.historical_peak || d;
  const ev0 = new Date(peak.evidence_start).getTime();
  const ev1 = new Date(peak.evidence_end).getTime();
  const x = t => PL + (t - t0) / (t1 - t0) * (W - PL - PR);

  const charts = codes.map(c => {
    const pts = (r.series[c] || []).filter(p => p.value_num != null);
    if (pts.length < 2) return `<div class="chart-item"><div class="chart-head"><b>${c}</b><span>sin datos suficientes</span></div></div>`;
    const vs = pts.map(p => p.value_num);
    const lo = Math.min(...vs), hi = Math.max(...vs), rango = (hi - lo) || 1;
    const y = v => PT + (1 - (v - lo) / rango) * (H - PT - PB);
    const paths = `<polyline fill="none" stroke="${COL[c] || '#888'}" stroke-width="1.5"
      stroke-linejoin="round" points="${pts.map(p =>
      `${x(new Date(p.event_time).getTime()).toFixed(1)},${y(p.value_num).toFixed(1)}`).join(' ')}"/>`;
    const ult = pts[pts.length - 1];
    const last = `<circle cx="${x(new Date(ult.event_time).getTime()).toFixed(1)}"
      cy="${y(ult.value_num).toFixed(1)}" r="3" fill="${COL[c] || '#888'}"/>`;
    return `<div class="chart-item"><div class="chart-head"><b style="color:${COL[c]}">${c}</b>
      <span>${lo.toFixed(1)}–${hi.toFixed(1)} · último ${Number(ult.value_num).toFixed(1)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <rect x="${Math.max(PL,x(ev0))}" y="${PT}" width="${Math.max(0,Math.min(W-PR,x(ev1))-Math.max(PL,x(ev0)))}" height="${H - PT - PB}"
            fill="#4fbab210"/>
      <line x1="${PL}" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="#2a3a3c"/>
      ${paths}${last}</svg></div>`;
  }).join('');

  const trajectory = d.risk_trajectory || [];
  let riskChart = '';
  if (trajectory.length > 1) {
    const RW = 900, RH = 118, RPL = 32, RPR = 8, RPT = 8, RPB = 18;
    const rx = t => RPL + (t - t0) / (t1 - t0) * (RW - RPL - RPR);
    const ry = v => RPT + (1 - v) * (RH - RPT - RPB);
    const points = trajectory.map(p => `${rx(new Date(p.at).getTime()).toFixed(1)},${ry(p.risk_score).toFixed(1)}`).join(' ');
    const thresholds = [[.4,'MEDIUM'],[.65,'HIGH'],[.85,'CRITICAL']].map(([v,label]) =>
      `<line x1="${RPL}" y1="${ry(v)}" x2="${RW-RPR}" y2="${ry(v)}" stroke="#2a3a3c" stroke-dasharray="3 3"/>
       <text x="${RPL+3}" y="${ry(v)-3}" fill="#71888a" font-size="8">${label}</text>`).join('');
    riskChart = `<div style="margin-bottom:14px"><div class="lbl">Evolución del riesgo calculado</div>
      <svg viewBox="0 0 ${RW} ${RH}" style="width:100%;height:auto;display:block;background:var(--ground)">
      ${thresholds}<polyline fill="none" stroke="#4fbab2" stroke-width="2" points="${points}"/>
      <text x="${RPL}" y="${RH-5}" fill="#71888a" font-size="9">${fecha(desde)}</text>
      <text x="${RW-RPR}" y="${RH-5}" fill="#71888a" font-size="9" text-anchor="end">${fecha(hasta)}</text>
      </svg></div>`;
  }

  const labEvents = labs.flatMap(code => (r.series[code] || []).filter(p => p.value_num != null)
    .map(p => ({...p, code})));
  const labHtml = labEvents.length ? `<div class="lbl" style="margin-top:14px">Laboratorios disponibles en el período</div>
    <div class="lab-list">${labEvents.map(p => {
      const abnormal = (p.ref_low != null && p.value_num < p.ref_low) || (p.ref_high != null && p.value_num > p.ref_high);
      const ref = p.ref_low != null && p.ref_high != null ? ` · ref. ${p.ref_low}–${p.ref_high}` : '';
      return `<span class="lab-chip ${abnormal ? 'abnormal' : ''}">${p.code} ${p.value_num}${ref}<br>${fecha(p.event_time)}</span>`;
    }).join('')}</div>` : '';

  $('#cv').innerHTML = `${riskChart}<div class="lbl">Canales fisiológicos · el sombreado marca las 6 h del episodio máximo</div>
    <div class="chart-grid">${charts}</div>${labHtml}
    <div style="margin-top:10px;font-size:11px;color:var(--text3)">
      Se muestran todos los datos disponibles hasta el corte, incluso los canales con aporte cero.
      Cada canal usa su propia escala para que su trayectoria sea legible.</div>`;
}

cargar();
</script>
</body>
</html>
